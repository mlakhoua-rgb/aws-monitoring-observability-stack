groups:
- name: Infrastructure Alerts
  rules:
  # High CPU Usage
  - alert: HighCPUUsage
    expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "High CPU usage detected on {{ $labels.instance }}"
      description: "CPU usage has been above 80% for more than 5 minutes on instance {{ $labels.instance }}. Current value: {{ $value }}%"

  # High Memory Usage
  - alert: HighMemoryUsage
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "High memory usage detected on {{ $labels.instance }}"
      description: "Memory usage has been above 85% for more than 5 minutes on instance {{ $labels.instance }}. Current value: {{ $value }}%"

  # Disk Space Low
  - alert: DiskSpaceLow
    expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
    for: 1m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: "Low disk space on {{ $labels.instance }}"
      description: "Disk space is below 15% on instance {{ $labels.instance }}. Available: {{ $value }}%"

  # Instance Down
  - alert: InstanceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: "Instance {{ $labels.instance }} is down"
      description: "Instance {{ $labels.instance }} has been down for more than 1 minute."

  # High Network Errors
  - alert: HighNetworkErrors
    expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 10
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "High network errors on {{ $labels.instance }}"
      description: "Network error rate is high on instance {{ $labels.instance }}. Rate: {{ $value }} errors/sec"

  # AWS CloudWatch Integration Alerts
  # (metric names as exported by cloudwatch-exporter/config.yml)
  - alert: ALBHighResponseTime
    expr: aws_applicationelb_target_response_time_average > 2
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "High ALB target response time"
      description: "ALB target response time is {{ $value }}s, which is above the 2s threshold"

  # RDS Alerts
  - alert: RDSHighCPU
    expr: aws_rds_cpuutilization_average > 75
    for: 10m
    labels:
      severity: warning
      team: database
    annotations:
      summary: "High RDS CPU utilization"
      description: "RDS instance {{ $labels.dbinstance_identifier }} CPU usage is {{ $value }}%"

  # S3 Request Errors
  - alert: S3HighErrorRate
    expr: rate(aws_s3_4xx_errors_sum[5m]) > 0.05
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "High S3 4xx error rate"
      description: "S3 bucket {{ $labels.bucket_name }} has high 4xx error rate: {{ $value }} errors/sec"