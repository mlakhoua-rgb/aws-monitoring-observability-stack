# Prometheus configuration — AWS deployment example.
#
# Used as the starting point for the EC2-hosted Prometheus (see
# terraform/modules/prometheus). Differences from the local lab config:
#  * node metrics come from EC2 service discovery (tag Monitoring=enabled)
#    instead of a static container target — the Prometheus instance role
#    needs ec2:DescribeInstances for this
#  * CloudWatch exporter brings in native AWS service metrics
#
# ECS workloads: Prometheus has no built-in ECS service discovery — use
# file_sd with a discovery sidecar (e.g. prometheus-ecs-discovery) or tag
# EC2 container hosts for the ec2_sd job below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aws'
    environment: 'prod'

rule_files:
  - "alert_rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter on EC2 instances, discovered by tag
  - job_name: 'node-exporter'
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
        filters:
          - name: tag:Monitoring
            values: [enabled]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
      - source_labels: [__meta_ec2_tag_Environment]
        target_label: environment
      - source_labels: [__meta_ec2_tag_Service]
        target_label: service
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone

  # Custom application metrics, discovered by tag
  - job_name: 'application-metrics'
    ec2_sd_configs:
      - region: us-east-1
        port: 8080
        filters:
          - name: tag:MetricsPort
            values: ['8080']
          - name: instance-state-name
            values: [running]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
      - source_labels: [__meta_ec2_tag_Service]
        target_label: service

  # AWS CloudWatch Exporter (RDS, ALB, Lambda, S3 — see
  # cloudwatch-exporter/config.yml for the exported metric list)
  - job_name: 'cloudwatch'
    scrape_interval: 5m # CloudWatch metrics update slowly; respect API cost
    static_configs:
      - targets: ['cloudwatch-exporter:9106']

# Remote write to long-term storage (optional)
# Uncomment when using a remote backend (e.g. Thanos, Amazon Managed Prometheus)
# remote_write:
#   - url: "https://your-remote-write-endpoint/receive"
#     sigv4:
#       region: us-east-1
#     queue_config:
