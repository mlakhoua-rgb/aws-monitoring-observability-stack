# Prometheus configuration — local lab (docker compose).
#
# This file is self-contained: every scrape target below exists in
# docker-compose.yml, so `docker compose up -d` yields a working stack with
# the GitHub monitoring demo live. The AWS-side configuration (EC2 service
# discovery, CloudWatch exporter) lives in prometheus-aws.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local-lab'
    environment: 'dev'

rule_files:
  - "alert_rules/*.yml"
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # --- Stack self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # --- Optional: AWS CloudWatch metrics (aws compose profile) ---
  # file_sd keeps the plain lab quiet: with no targets file the job has zero
  # targets, so there is no dead-target noise and no false InstanceDown alert.
  # To enable, run:
  #   cp prometheus/targets/cloudwatch.yml.example prometheus/targets/cloudwatch.yml
  #   docker compose --profile aws up -d
  # Prometheus picks the file up live — no restart needed.
  - job_name: 'cloudwatch'
    scrape_interval: 5m # CloudWatch metrics update slowly; respect API cost
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/cloudwatch*.yml'

  # --- GitHub monitoring demo (blackbox probes) ---
  # 2-minute interval keeps unauthenticated api.github.com probes well under
  # GitHub's 60 requests/hour/IP rate limit. Alert `for:` durations assume
  # this cadence.
  - job_name: 'github-http'
    metrics_path: /probe
    scrape_interval: 2m
    scrape_timeout: 30s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://github.com
          - https://api.github.com
          - https://www.githubstatus.com/api/v2/status.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Separate low-frequency job for certificate expiry tracking.
  - job_name: 'github-ssl'
    metrics_path: /probe
    scrape_interval: 15m
    scrape_timeout: 30s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://github.com
          - https://api.github.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
