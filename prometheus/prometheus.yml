# Prometheus Configuration for AWS Infrastructure Monitoring
# Production-ready setup with service discovery and alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aws-production'
    environment: 'prod'

rule_files:
  - "alert_rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for EC2 instances
  - job_name: 'node-exporter'
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
        filters:
          - name: tag:Monitoring
            values: [enabled]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      # Use instance ID as the instance label
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
      # Add environment tag
      - source_labels: [__meta_ec2_tag_Environment]
        target_label: environment
      # Add service tag
      - source_labels: [__meta_ec2_tag_Service]
        target_label: service
      # Add availability zone
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone

  # AWS CloudWatch Exporter
  - job_name: 'cloudwatch'
    static_configs:
      - targets: ['cloudwatch-exporter:9106']

  # Application metrics (if using custom exporters)
  - job_name: 'application-metrics'
    ec2_sd_configs:
      - region: us-east-1
        port: 8080
        filters:
          - name: tag:MetricsPort
            values: ['8080']
          - name: instance-state-name
            values: [running]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
      - source_labels: [__meta_ec2_tag_Service]
        target_label: service

  # ECS Service Discovery (if using ECS)
  - job_name: 'ecs-tasks'
    ecs_sd_configs:
      - region: us-east-1
        cluster: production
        port: 9090
    relabel_configs:
      - source_labels: [__meta_ecs_task_definition_family]
        target_label: job
      - source_labels: [__meta_ecs_service_name]
        target_label: service
      - source_labels: [__meta_ecs_cluster_name]
        target_label: cluster

  # Load Balancer metrics
  - job_name: 'aws-alb'
    static_configs:
      - targets: ['localhost:9106']
    metrics_path: /probe
    params:
      module: [aws_alb]
      target: [arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/my-load-balancer/1234567890123456]

# Remote write to long-term storage (optional)
remote_write:
  - url: "https://prometheus-remote-write.example.com/receive"
    basic_auth:
      username: "prometheus"
      password: "your-password"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500