# Grafana Dashboard Provisioning
# Author: Mohamed Ben Lakhoua (AI-Augmented with Claude Code)
# License: MIT

apiVersion: 1

providers:
  - name: 'Default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
