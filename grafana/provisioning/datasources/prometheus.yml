apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid — the provisioned dashboards reference datasource uid
    # "prometheus"; without this Grafana generates a random uid and the
    # dashboard panels cannot resolve their datasource.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
